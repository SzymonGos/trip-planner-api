spring.application.name=trip-planner-api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.security.oauth2.resourceserver.jwt.issuer-uri=${CLERK_ISSUER}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${CLERK_JWKS_URL}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

app.usage.google-maps.max-limit=10
app.trip-images.max-limit=5

app.images.max-file-size=5MB
app.images.allowed-content-types=image/jpeg,image/png,image/webp

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB